<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGINT OPS</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <header class="header">
      <div class="logo">
    <img src="assets/shield.svg" alt="Security Shield">
</div>

        <h1>SIGINT OPS</h1>

        <div class="online-status">
            <span class="status-dot"></span>
            SECURE • ONLINE
        </div>
    </header>

    <main>
   <section class="dashboard">

    <div class="scanner">
        <div class="radar">
            <div class="radar-sweep"></div>

            <span class="radar-dot dot-one"></span>
            <span class="radar-dot dot-two"></span>
            <span class="radar-dot dot-three"></span>
        </div>
    </div>

    <div class="dashboard-info">
        <div class="stat">
            <span class="stat-number">24</span>
            <span class="stat-label">ACTIVE SIGNALS</span>
        </div>

        <div class="stat">
            <span class="stat-number">07</span>
            <span class="stat-label">PRIORITY ALERTS</span>
        </div>
    </div>

</section>
</main>

</body>
</html>
