<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGINT OPS</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <header class="header">
      <div class="logo">
    <img src="assets/shield.svg" alt="Security Shield">
</div>

        <h1>SIGINT OPS</h1>

        <div class="online-status">
            <span class="status-dot"></span>
            SECURE • ONLINE
        </div>
    </header>

    <main>
   <section class="dashboard">

    <div class="scanner">
        <div class="radar">
            <div class="radar-sweep"></div>

            <span class="radar-dot dot-one"></span>
            <span class="radar-dot dot-two"></span>
            <span class="radar-dot dot-three"></span>
        </div>
    </div>

    <div class="dashboard-info">
        <div class="stat">
            <span class="stat-number">24</span>
            <span class="stat-label">ACTIVE SIGNALS</span>
        </div>

        <div class="stat">
            <span class="stat-number">07</span>
            <span class="stat-label">PRIORITY ALERTS</span>
        </div>
    </div>

</section>

<section class="actions">
    <button class="action-btn">
       <img src="assets/zap.svg" alt="">
        New Brief
    </button>

    <button class="action-btn">
        <img src="assets/code.svg" alt="">
        Decode
    </button>

    <button class="action-btn">
        <img src="assets/rocket.svg" alt="">
        Request Drone
    </button>
</section>

<section class="cards">

    <article class="mission-card green">
        <div class="card-top">
            <span class="priority critical">CRITICAL</span>
            <span class="card-status">In Progress</span>
        </div>

        <h3>Operation Nightfall</h3>

        <div class="card-progress">
            <div class="progress-track">
                <div class="progress-fill" style="width: 65%;"></div>
            </div>
            <span>65%</span>
        </div>
    </article>

    <article class="mission-card yellow">
        <div class="card-top">
            <span class="priority high">HIGH</span>
            <span class="card-status">Analyzing</span>
        </div>

        <h3>Signal Intercept Alpha</h3>

        <div class="card-progress">
            <div class="progress-track">
                <div class="progress-fill" style="width: 40%;"></div>
            </div>
            <span>40%</span>
        </div>
    </article>

    <article class="mission-card green">
        <div class="card-top">
            <span class="priority medium">MEDIUM</span>
            <span class="card-status">Pending</span>
        </div>

        <h3>Asset Recovery</h3>

        <div class="card-progress">
            <div class="progress-track">
                <div class="progress-fill" style="width: 15%;"></div>
            </div>
            <span>15%</span>
        </div>
    </article>

    <article class="mission-card yellow">
        <div class="card-top">
            <span class="priority high">HIGH</span>
            <span class="card-status">Active</span>
        </div>

        <h3>Cyber Defense Grid</h3>

        <div class="card-progress">
            <div class="progress-track">
                <div class="progress-fill" style="width: 80%;"></div>
            </div>
            <span>80%</span>
        </div>
    </article>

</section>


</main>

</body>
</html>
